{% extends "base.html" %}

{% block title %}
Login
{% endblock %}

{% block extra_css %}

<link
    rel="stylesheet"
    href="{% static 'css/login.css' %}"
>

{% endblock %}


{% block content %}

<div class="login-container">

    <h2>Login</h2>

    <form method="POST">

        {% csrf_token %}

        <input
            type="text"
            name="username"
            class="form-control mb-3"
            placeholder="Username"
            required
        >

        <input
            type="password"
            name="password"
            class="form-control mb-3"
            placeholder="Password"
            required
        >

        <button
            type="submit"
            class="btn btn-primary w-100"
        >
            Login
        </button>

    </form>

</div>

{% endblock %}
